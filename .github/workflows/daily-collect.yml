# .github/workflows/daily-collect.yml
#
# 이 파일이 하는 일:
#   매일 한국시간 오전 6시에 자동으로 실행되어
#   날씨, 뉴스, 시장, 지원사업 데이터를 수집하고
#   data/*.json 파일을 GitHub 에 자동 저장합니다.
#
# GitHub Actions cron 은 UTC 기준입니다.
# 한국시간(KST) 오전 6시 = UTC 전날 21시
#   cron: "0 21 * * *"
#   형식: 분 시 일 월 요일
#
# workflow_dispatch 를 추가하면 GitHub 웹에서 수동으로도 실행할 수 있습니다.

name: Daily Data Collection

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 KST 06:00 (UTC 21:00) 실행
  workflow_dispatch:         # 수동 실행 허용

# GitHub Actions 봇이 저장소에 파일을 push 할 수 있도록 쓰기 권한 부여
permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest   # GitHub 가 제공하는 무료 우분투 환경에서 실행

    steps:
      # 1단계: 저장소 코드를 가져옵니다
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2단계: Python 3.11 을 설치합니다
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3단계: requirements.txt 에 적힌 패키지를 설치합니다
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4단계: 각 수집 스크립트를 순서대로 실행합니다
      #   스크립트 하나가 실패해도 나머지는 계속 실행됩니다 (|| true)
      - name: Run data collectors
        env:
          # GitHub Secrets 에 등록한 API 키를 환경변수로 주입합니다
          # 기업마당 API 키가 없으면 샘플 데이터가 사용됩니다
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
        run: |
          python scripts/collect_weather.py  || echo "[경고] 날씨 수집 실패"
          python scripts/collect_news.py     || echo "[경고] 뉴스 수집 실패"
          python scripts/collect_market.py   || echo "[경고] 시장 수집 실패"
          python scripts/collect_supports.py || echo "[경고] 지원사업 수집 실패"

      # 5단계: 변경된 JSON 파일을 자동으로 commit 하고 push 합니다
      #   변경이 없으면 commit 하지 않습니다 (git diff --cached --quiet)
      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet || git commit -m "chore: update daily collected data [$(date +'%Y-%m-%d %H:%M KST')]"
          git push
